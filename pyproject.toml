[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infinity-symbol-tools"
version = "0.1.0"
description = "Standalone source-side Infinity SVG acquisition tools"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
infinity-symbol-source = "infinity_symbol_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
