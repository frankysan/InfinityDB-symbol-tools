[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infinity-symbol-tools"
version = "0.1.0"
description = "Standalone source-side Infinity SVG acquisition tools"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
processing = [
    "fonttools>=4",
    "cssselect2>=0.7",
    "tinycss2>=1.2",
    "Pillow>=10",
]

[project.scripts]
infinity-symbol-source = "infinity_symbol_tools.cli:main"
infinity-symbol-overrides = "infinity_symbol_tools.effective_processing:main"
infinity-symbol-preflight = "infinity_symbol_tools.svg_preflight:main"
infinity-symbol-font-audit = "infinity_symbol_tools.svg_font_audit:main"
infinity-symbol-duplicates = "infinity_symbol_tools.svg_duplicates:main"
infinity-symbol-fonts = "infinity_symbol_tools.svg_processor:main"
infinity-symbol-compress = "infinity_symbol_tools.svg_compress:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
infinity_symbol_tools = ["font-aliases.json"]
